<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting…</title>
    <script>
      // GitHub Pages serves this file for any URL that isn't a real file.
      // SPA fallback: bounce to /?p=/the/requested/path (with query preserved)
      // so index.html can restore the clean URL via history.replaceState
      // before React Router reads window.location. Real files — index.html,
      // static pages like /ram-manager/privacy.html, images — are served
      // directly and never hit this.
      (function () {
        var l = window.location;
        var path = l.pathname.slice(1); // strip leading /
        var search = l.search.slice(1); // strip leading ?
        var target = "/?p=/" + path.replace(/&/g, "~and~");
        if (search) target += "&" + search.replace(/&/g, "~and~");
        if (l.hash) target += l.hash;
        l.replace(target);
      })();
    </script>
  </head>
  <body></body>
</html>
